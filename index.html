<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Flaming Grill — Kitchen, Bar & Bakery</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #d4961a;
    --gold-light: #f0b830;
    --gold-dim: rgba(212,150,26,0.45);
  }
  html { scroll-behavior: smooth; }
  body { font-family: "DM Sans", sans-serif; overflow-x: hidden; background: #000; min-height: 100vh; }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 1rem 2rem;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(212,150,26,0.15);
  }
  nav img { height: 52px; width: auto; display: block; }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    background: #000;
    position: relative;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .hero-glow {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 55% 65% at 72% 52%, rgba(212,150,26,0.11) 0%, transparent 70%);
  }
  .flame-deco {
    position: absolute; right: 0; top: 0; bottom: 0;
    width: 52%; pointer-events: none; opacity: 0.06;
  }
  .flame-deco svg { width: 100%; height: 100%; }

  .hero-body {
    position: relative; z-index: 5;
    padding: 8rem 10vw 5rem;
    max-width: 760px;
  }
  .hero-h1 {
    font-family: "Playfair Display", serif;
    font-size: clamp(3.2rem, 7vw, 5.8rem);
    line-height: 1.05; color: var(--gold); font-weight: 700;
    margin-bottom: 0.6rem;
  }
  .hero-h1 em { font-style: italic; color: #fff; font-weight: 400; }
  .hero-sub {
    font-size: 0.82rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gold-dim); margin-bottom: 2.8rem;
  }

  /* ── LINK GRID ── */
  .link-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.75rem;
    max-width: 440px;
  }
  .link-btn {
    display: flex; align-items: center; gap: 0.65rem;
    padding: 0.95rem 1.2rem;
    border: 1px solid rgba(212,150,26,0.28);
    background: rgba(212,150,26,0.04);
    color: rgba(212,150,26,0.8);
    text-decoration: none; font-size: 0.88rem; font-weight: 500;
    letter-spacing: 0.03em;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .link-btn svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
  .link-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(212,150,26,0.09); }
  .link-btn.ig:hover { border-color: #e1306c; color: #e1306c; background: rgba(225,48,108,0.07); }
  .link-btn.fb:hover { border-color: #1877f2; color: #1877f2; background: rgba(24,119,242,0.07); }
  .link-btn.maps:hover { border-color: #4285f4; color: #4285f4; background: rgba(66,133,244,0.07); }
  .link-btn.web:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.05); }
  .link-btn.yelp:hover { border-color: #d32323; color: #d32323; background: rgba(211,35,35,0.07); }

  /* span full width for odd last item */
  .link-btn.full { grid-column: 1 / -1; max-width: 100%; }

  /* ── FOOTER ── */
  footer {
    position: relative; z-index: 5;
    background: #000; border-top: 1px solid rgba(212,150,26,0.12);
    padding: 1.4rem 2rem; text-align: center;
  }
  footer p { font-size: 0.72rem; color: rgba(212,150,26,0.3); line-height: 2; }
  footer a { color: var(--gold); text-decoration: none; }
  footer a:hover { opacity: 0.7; }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    nav img { height: 40px; }
    .hero-body { padding: 7rem 6vw 4rem; }
    .hero-h1 { font-size: clamp(2.4rem, 10vw, 3.4rem); }
    .link-grid { max-width: 100%; gap: 0.6rem; }
    .flame-deco { width: 100%; opacity: 0.04; }
  }
</style>
</head>
